<mat-card class="bar">
  <div class="bar__left">
    <button mat-stroked-button (click)="prev.emit()">
      <mat-icon>chevron_left</mat-icon>
      <span class="btn-label">Mes anterior</span>
    </button>

    <button mat-stroked-button (click)="today.emit()">
      <mat-icon>today</mat-icon>
      <span class="btn-label">Hoy</span>
    </button>

    <button mat-stroked-button (click)="next.emit()">
      <span class="btn-label">Mes siguiente</span>
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <div class="bar__right">
    <div class="label">{{ monthLabel }}</div>
  </div>
</mat-card>
